name: Vanguard-SIEM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch application sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -L https://raw.githubusercontent.com/princiecherry95-coder/Vanguard/${GITHUB_SHA}/app.py -o app.py
          curl --fail --silent --show-error -L https://raw.githubusercontent.com/princiecherry95-coder/Vanguard/${GITHUB_SHA}/requirements.txt -o requirements.txt

      - name: Verify source integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s app.py
          test -s requirements.txt
          python --version
          python -m py_compile app.py

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Streamlit startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/ > /tmp/vanguard.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat streamlit.log
            exit 1
          fi
          grep -q "VANGUARD-SIEM" /tmp/vanguard.html
          grep -q "Tactical Operations Console" /tmp/vanguard.html
          echo "Vanguard-SIEM Streamlit smoke test passed."
