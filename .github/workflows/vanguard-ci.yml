name: Vanguard-SIEM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Offline source smoke test
        run: python smoke_test.py

      - name: Offline engine regression tests
        run: python test_engine.py

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Syntax validation
        run: python -m py_compile app.py engine.py test_engine.py

      - name: Streamlit runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process python -ArgumentList '-m streamlit run app.py --server.headless true --server.port 8501' -RedirectStandardOutput streamlit.log -RedirectStandardError streamlit-error.log -PassThru
          try {
            $passed = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8501/' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $body = $response.Content
                  if ($body -match 'VANGUARD-SIEM' -and $body -match 'Tactical Operations Console' -and $body -match 'Air-Gapped Local Net') {
                    $passed = $true
                    break
                  }
                }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $passed) {
              Write-Host '--- streamlit.log ---'
              if (Test-Path streamlit.log) { Get-Content streamlit.log }
              Write-Host '--- streamlit-error.log ---'
              if (Test-Path streamlit-error.log) { Get-Content streamlit-error.log }
              throw 'Vanguard-SIEM runtime smoke test FAILED.'
            }
            Write-Host 'Vanguard-SIEM runtime smoke test PASSED.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
