name: Vanguard-SIEM CI • Cross-Platform Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install runtime and development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Pytest regression suite
        run: python -m pytest -q
      - name: Ruff correctness gate
        run: python -m ruff check --output-format=github app.py engine.py ingestion.py audit.py evidence_store.py detection_registry.py risk.py triage.py soc_pipeline.py export_service.py
      - name: Ruff advisory quality report
        continue-on-error: true
        run: python -m ruff check --output-format=github app.py engine.py ingestion.py audit.py evidence_store.py detection_registry.py risk.py triage.py soc_pipeline.py export_service.py
      - name: Bandit security scan
        run: python -m bandit -q -r engine.py ingestion.py audit.py evidence_store.py detection_registry.py risk.py triage.py soc_pipeline.py -lll
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt
      - name: Source smoke test
        run: python smoke_test.py
      - name: Engine regression tests
        run: python test_engine.py
      - name: Ingestion regression tests
        run: python test_ingestion.py
      - name: Unified pipeline regression tests
        run: python test_pipeline.py
      - name: Audit regression tests
        run: python test_audit.py
      - name: Defensive security regression tests
        run: python test_security.py
      - name: Compile all runtime modules
        run: python -m py_compile app.py engine.py ingestion.py audit.py distributed.py firewall.py remediation.py threat_intel.py windows_events.py local_ai.py soc_pipeline.py detection_registry.py evidence_store.py risk.py triage.py runtime_smoke_test.py
      - name: Cross-platform runtime smoke test
        run: python runtime_smoke_test.py


  container:
    name: Vercel container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build production container
        run: docker build -f Dockerfile.vercel -t vanguard-vercel-smoke .
      - name: Start production container
        run: |
          docker run -d --name vanguard-vercel-smoke -p 8080:80 vanguard-vercel-smoke
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/_stcore/health | grep -qi ok; then
              echo "Vanguard Vercel container smoke test: PASS"
              exit 0
            fi
            sleep 2
          done
          docker logs vanguard-vercel-smoke
          exit 1
      - name: Stop production container
        if: always()
        run: docker rm -f vanguard-vercel-smoke 2>/dev/null || true
