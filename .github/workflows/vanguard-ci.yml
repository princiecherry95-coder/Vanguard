name: Vanguard-SIEM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Syntax validation
        run: python -m py_compile app.py

      - name: Streamlit runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/ > /tmp/vanguard.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/vanguard.html
          grep -q "VANGUARD-SIEM" /tmp/vanguard.html
          grep -q "Tactical Operations Console" /tmp/vanguard.html
          grep -q "Air-Gapped Local Net" /tmp/vanguard.html
          echo "Vanguard-SIEM runtime smoke test PASSED."
