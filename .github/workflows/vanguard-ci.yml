name: Vanguard-SIEM CI • Cross-Platform Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Source smoke test
        run: python smoke_test.py
      - name: Engine regression tests
        run: python test_engine.py
      - name: Ingestion regression tests
        run: python test_ingestion.py
      - name: Unified pipeline regression tests
        run: python test_pipeline.py
      - name: Audit regression tests
        run: python test_audit.py
      - name: Defensive security regression tests
        run: python test_security.py
      - name: Compile all runtime modules
        run: python -m py_compile app.py engine.py ingestion.py audit.py distributed.py firewall.py remediation.py threat_intel.py windows_events.py local_ai.py soc_pipeline.py runtime_smoke_test.py
      - name: Cross-platform runtime smoke test
        run: python runtime_smoke_test.py
