name: Vanguard-SIEM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Streamlit startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/ > /tmp/vanguard.html; then
              break
            fi
            sleep 1
          done
          grep -q "VANGUARD-SIEM" /tmp/vanguard.html
          grep -q "Tactical Operations Console" /tmp/vanguard.html
          echo "Vanguard-SIEM Streamlit smoke test passed."
