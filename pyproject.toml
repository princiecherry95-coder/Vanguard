[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-siem"
version = "0.4.0"
description = "Offline-first SOC log intelligence and defensive analytics platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit==1.64.0",
  "pandas==2.3.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.0",
  "mypy==1.18.2",
  "bandit==1.8.6",
  "pip-audit==2.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = [".git", ".venv"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.bandit]
exclude_dirs = [".venv", "tests"]
